name: Build Android APK

on:
push:
branches: [ main ]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: دریافت فایل‌های پروژه
uses: actions/checkout@v4

- name: آماده‌سازی Java
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'

- name: آماده‌سازی Gradle
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.9'

- name: ساخت برنامه اندروید
run: gradle --no-daemon assembleDebug

- name: آماده‌سازی فایل APK
uses: actions/upload-artifact@v4
with:
name: hesabgar-souti-farsi
path: app/build/outputs/apk/debug/app-debug.apk
